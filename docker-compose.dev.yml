# Development overrides: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Exposes PostgreSQL and Redis on 127.0.0.1 ONLY (never on a public interface).
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "1"
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
