# Edge proxy (HTTP). Production TLS lives in nginx/prod/default.conf.
# Tracker ports are NOT proxied here; the gateway publishes them directly (Layer 4).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream backend_app { server backend:8000; }
upstream frontend_app { server frontend:8080; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /health    { proxy_pass http://backend_app; include /etc/nginx/snippets/proxy.conf; }
    location = /readiness { proxy_pass http://backend_app; include /etc/nginx/snippets/proxy.conf; }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend_app;
        include /etc/nginx/snippets/proxy.conf;
    }
    location /ws/ {
        proxy_pass http://backend_app;
        include /etc/nginx/snippets/proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /admin/ { proxy_pass http://backend_app; include /etc/nginx/snippets/proxy.conf; }
    location /static/ { alias /srv/static/; expires 7d; access_log off; }
    location /media/  { alias /srv/media/; }

    location / { proxy_pass http://frontend_app; include /etc/nginx/snippets/proxy.conf; }
}
