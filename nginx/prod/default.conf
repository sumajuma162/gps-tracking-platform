# Production edge proxy with TLS (Let's Encrypt via certbot webroot). Replace gps.example.com.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
upstream backend_app { server backend:8000; }
upstream frontend_app { server frontend:8080; }

server {
    listen 80;
    server_name gps.example.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gps.example.com;
    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/gps.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gps.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/security-headers.conf;

    location = /health    { proxy_pass http://backend_app; include /etc/nginx/snippets/proxy.conf; }
    location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://backend_app; include /etc/nginx/snippets/proxy.conf; }
    location /ws/ {
        proxy_pass http://backend_app;
        include /etc/nginx/snippets/proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /admin/ {
        # allow 203.0.113.0/24;  deny all;   # restrict Django Admin to your office/VPN
        proxy_pass http://backend_app; include /etc/nginx/snippets/proxy.conf;
    }
    location /static/ { alias /srv/static/; expires 7d; access_log off; }
    location / { proxy_pass http://frontend_app; include /etc/nginx/snippets/proxy.conf; }
}
