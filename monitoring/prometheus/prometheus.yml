# Prometheus for the GPS platform (spec A15). Started with: docker compose --profile monitoring up -d
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token   # same value as METRICS_TOKEN (empty file = no token)
    static_configs: [{ targets: ["backend:8000"] }]
  - job_name: gateway
    metrics_path: /metrics
    static_configs: [{ targets: ["gateway:8081"] }]
  - job_name: processor
    metrics_path: /metrics
    static_configs: [{ targets: ["processor:8082"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
