# pgBackRest for point-in-time recovery (spec A15). Used by docker-compose.backup.yml.
# NOT verified in the build environment (no Docker or object storage there): run the restore drill in
# docs/BACKUP_RESTORE.md on staging before relying on it.
#
# Fill in the S3-compatible bucket; credentials come from the environment (PGBACKREST_REPO1_S3_KEY,
# PGBACKREST_REPO1_S3_KEY_SECRET), never from this file.
[global]
repo1-type=s3
repo1-s3-bucket=CHANGE-ME-gps-backups
repo1-s3-endpoint=s3.amazonaws.com
repo1-s3-region=eu-west-1
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass comes from PGBACKREST_REPO1_CIPHER_PASS
# Full weekly, differential daily (scheduled outside, see docs/BACKUP_RESTORE.md); keep 4 full backups (~4 weeks)
# and WAL for point-in-time recovery inside that window.
repo1-retention-full=4
compress-type=zst
process-max=2
log-level-console=info
start-fast=y

[gps]
pg1-path=/home/postgres/pgdata/data
pg1-user=postgres
