[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["S105", "S106"]
"**/tests/*" = ["S105", "S106"]
"**/tests.py" = ["S105", "S106"]
